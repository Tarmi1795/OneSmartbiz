<!--
  Google Search Console — HTML file verification placeholder.

  To verify onesmartbiz.pro via HTML file upload:
  1. In Google Search Console, choose "HTML file" verification and download
     the generated file (named like google1a2b3c4d5e6f.html).
  2. Replace THIS file in /public with the downloaded file (keep the exact
     filename Google generated), then redeploy and click "Verify".
     The file content must start with: google-site-verification: <token>

  Alternative (meta tag method, already wired up in app/layout.tsx):
  Set NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION in .env to the content of the
  <meta name="google-site-verification" content="..."> token from Search
  Console, then redeploy.
-->
google-site-verification: REPLACE_WITH_YOUR_GOOGLE_SEARCH_CONSOLE_TOKEN
